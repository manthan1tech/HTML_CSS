<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson-11</title>
    <style>
        p{
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 0;
            margin-bottom: 0;
        }

        .container{
           width: 200px;
           display: grid;
           grid-template-rows: 200px 130px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 3);
        }
        .pfp{
            height: 200px;
            width: 200px;
            object-fit: cover;
            object-position: right;
        }

        .name{
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            margin-left: 5px;
        }
        .mutual-pfp{
            height: 28px;
            width: 28px;
            border-radius: 25px;
            align-items: center;
        }
        .mutual-fd{
           margin-left: 8px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 28px 1fr;
            
          
        }
         .mutual{
            color: rgb(100, 100, 100);
            margin-left: 8px;
            margin-bottom: 12px;
            margin-top: 8px;
        }
        .add{
            background-color: rgb(24, 119, 242);
            color: white;
            border: none;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius: 4px;
            font-size: 16px;
            margin-left: 8px;
            margin-bottom: 10px;
        }
        .user-info{
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div style="display: grid;
    grid-template-columns: 200px 200px 200px;
    column-gap: 50px;
    margin-left: 30px;">

        <div class="container">
            <div>
            <img src="random.avif" alt="" class="pfp">
            </div>
            <div class="user-info">
                <p class="name">Emma</p>
            <div class="mutual-fd">
                <img src="shindo.jpg" class="mutual-pfp">
                <p class="mutual">2 mutual friend</p>
            </div>
            <button class="add">Add Friend</button>
            </div>
        </div>

         <div class="container">
            <div>
            <img src="izumi.jpg" alt="" class="pfp">
            </div>
        <div class="user-info">
            <p class="name">Izumi Miyamora</p>
            <div class="mutual-fd">
                <img src="shindo.jpg" class="mutual-pfp">
            <p class="mutual">20 mutual friend</p>
            </div>
            <button class="add">Add Friend</button>
        </div>
    </div>

     <div class="container">
        <div>
        <img src="Hori.jpg" alt="" class="pfp">
        </div>
       <div class="user-info">
        <p class="name">Kyuko Hori</p>
        <div class="mutual-fd">
             <img src="shindo.jpg" class="mutual-pfp">
           <p class="mutual">10 mutual friend</p>
        </div>
        <button class="add">Add Friend</button>
       </div>
    </div>
    </div>
</body>
</html>
