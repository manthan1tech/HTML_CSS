<!DOCTYPE html>
<html>
    <head>
        
        <TITle>youtube.clone</TITle>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <style>
            p{
                font-family: Roboto ,Arial;
                margin-top: 0;
                margin-bottom: 0;
            }
             .thumbnail{
                width: 300px;
            }
            .search-bar{
                display: block;
            }
            .video-preview{
                vertical-align: top;
                display: inline-block;
                width: 300px;
                margin-right: 10px;
            }
            .video-title{
                margin: 0;
                font-size: 15px;
                font-weight: 500;
                line-height: 15px;
                padding-top: 14px;
                margin-bottom: 15px;
            
            }
            .video-stats,
            .youtuber{
                font-size: 15px;
                color: #606060;
            }
            .youtuber{
                margin-bottom: 5px;
            }
           
            .pfp{
                display: inline-block;
                width: 50px;
                vertical-align: top;
                margin-top: 15px;
                margin-right: 8px;
                
            }
            .channel-info{
                display: inline-block;
                width: 230px;
            }
            .profile-pic{
                width: 100%;
                border-radius: 25px;
            }
          

        </style>
    </head>
    <body>
        <input class="search-bar" type="text" placeholder="search">
       
        <div class="video-preview">
        <div>
            <img class="thumbnail"  src="Thumbnail/payal.avif" alt="">
        </div>
            <div class="pfp">
            <img src="pfp/payal.jpg" alt="" class="profile-pic">
            </div>
        <div class="channel-info">
            <p class="video-title">NEW HOUSE TOUR UPDATE VLOG 🔥ALMOST READY😆</p>
            <p class="youtuber">PAYAL GAMING</p>
            <p class="video-stats">1M views &#183  11 months ago</p>
        </div>
        </div>


        <div class="video-preview">
            <div> <img class="thumbnail"  src="Thumbnail/kash.avif" alt=""></div>
            <div class="pfp">
                <img src="pfp/kash.jpg" alt="" class="profile-pic">
            </div>
            <div class="channel-info">
                <p class="video-title">Resident Evil 9 Requiem - Insanity Difficulty Challenge 🔥</p>
                <p class="youtuber">Kaash Plays</p>

            </div>
        
        </div>
         
</html>
